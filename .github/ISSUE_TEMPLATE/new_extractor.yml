name: New site extractor
description: Propose (or claim) support for extracting a specific site
title: "Add a <site> extractor"
labels: ["extractor"]
body:
  - type: textarea
    id: site
    attributes:
      label: Which site?
      description: Name it, plus an example URL for the page type this handles.
      placeholder: |
        Site:
        Example URL:
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What does Apogee do there today?
      description: |
        Every site falls through to the generic Readability extractor unless someone wrote one for it. Say what that produces now and why it is not good enough.

        Examples: missing comments, mangled structure, navigation furniture pulled into the text, content behind a lazy-loaded SPA.
    validations:
      required: true

  - type: textarea
    id: handles
    attributes:
      label: Pages it should handle
      description: List the page types and URL shapes. An extractor must return `null` for everything else.
      placeholder: |
        - Article pages: https://example.com/posts/...
        - Thread pages: https://example.com/threads/...
    validations:
      required: true

  - type: textarea
    id: skips
    attributes:
      label: Pages it should skip
      description: Listing pages, profiles, search results, and anything else outside scope. These keep falling through to Readability, so the extractor must return `null` for them.
      placeholder: |
        - Home page
        - Profile pages
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Is the content in the DOM, or in an API?
      description: |
        Both patterns already exist to copy from. See [hackernews.js](https://github.com/darshi1337/apogee/blob/main/apogee-extension/content/extractors/hackernews.js) for server-rendered DOM and [reddit.js](https://github.com/darshi1337/apogee/blob/main/apogee-extension/content/extractors/reddit.js) for same-origin JSON. If the site has a comment tree, [thread.js](https://github.com/darshi1337/apogee/blob/main/apogee-extension/content/extractors/thread.js) gives you the reply hierarchy, path notation, and selection for free.
      options:
        - Server-rendered DOM
        - Same-origin JSON API
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: unusual
    attributes:
      label: Anything unusual about the page?
      description: Infinite scroll, shadow DOM, content that appears only after interaction, login walls, region differences. These facts usually decide whether an extractor takes an evening or a week.
    validations:
      required: false

  - type: checkboxes
    id: done
    attributes:
      label: Done means this
      description: Keep this section. It states what "done" means for the eventual PR.
      options:
        - label: Extractor added under `content/extractors/`, registered in `content/content.js` and in the injection list in `lib/extract/pageExtraction.js`
        - label: Returns `null` for the pages listed above
        - label: A test under `tests/extractors/` with a trimmed, scrubbed HTML fixture. See [tests/extractors/README.md](https://github.com/darshi1337/apogee/blob/main/apogee-extension/tests/extractors/README.md). This part needs no browser or model download
        - label: "`npm run format:check`, `npm run lint`, `npm test`, `npm run build` all pass"
        - label: From the repo root, `npm run check:consistency` passes
        - label: No new host permission. If the site needs one, say so in the PR. That means updating the manifest, README, PRIVACY.md and docs/STORE-LISTING.md together
