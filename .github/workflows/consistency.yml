name: Consistency

# Catches the drift that blocks store review: versions in 4 files plus the
# release badge, docs/STORE-LISTING.md version stamp, required store assets,
# locale catalog completeness plus shared glossary terms. Also lints the
# workflows themselves. Read-only, fast, no dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: consistency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consistency:
    name: Consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Versions, badge, store listing, assets, and permissions docs
        run: node scripts/check-consistency.mjs

      - name: Locale catalog complete + glossary shared
        run: node apogee-extension/scripts/check-locales.mjs

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1.80.6
        with:
          fail_level: error

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Annotations instead of Advanced Security: SARIF upload needs
      # security-events: write, which this read-only workflow must not have.
      # Per the action docs these two are mutually exclusive.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          annotations: true

  pr-title:
    name: PR title looks like a changelog entry (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check title, warn but never fail
        # PR title goes through $PR_TITLE, never ${{ }} inline: a title is
        # attacker-controlled, and inline expansion is a script-injection hole.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -qiE '^(feat|fix|perf|security|docs|chore|style|test|refactor|ci|build)(\(.+\))?: .+'; then
            echo "Title OK: $PR_TITLE"
          else
            echo "::warning::PR title does not look like 'type: summary' (feat/fix/perf/security/docs/chore/...). Merges still work, but the changelog bot will skip it. See CONTRIBUTING.md."
          fi
