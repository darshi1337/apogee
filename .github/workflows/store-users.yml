name: Store Users Sync

# Keeps the self-hosted combined Chrome + Firefox user badge current.
# Chrome has no public stats API; Shields.io maintains the listing scrape.
# Firefox uses the public AMO API via Shields.io. Main is protected, so
# SYNC_TOKEN opens a PR and auto-merge lands it after the required checks.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-users-sync
  cancel-in-progress: true

jobs:
  sync-store-users:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHROME_ID: pgemlpomhkdcjjjcpnjlebalnfglomog
      AMO_SLUG: apogeeext
    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Add a fine-grained PAT with Contents and Pull requests write access."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh user badge
        env:
          STORE_USERS_SUMMARY: ${{ runner.temp }}/store-users.md
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path

          BADGE = Path(".github/assets/badge-users.svg")
          SUMMARY = Path(os.environ["STORE_USERS_SUMMARY"])

          def fetch(url):
              last_error = None
              for attempt in range(3):
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "apogee-store-users-sync"}
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return response.read().decode("utf-8")
                  except Exception as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise SystemExit(f"failed to fetch {url}: {last_error}")

          def read_count(svg, label):
              match = re.search(rf"<title>{label}: ([^<]+)</title>", svg)
              if not match:
                  raise SystemExit(f"{label} badge has no title: {svg[:200]!r}")
              value = match.group(1)
              parsed = re.fullmatch(
                  r"([0-9]+(?:\.[0-9]+)?)([kKmM]?)",
                  value.replace(",", "").rstrip("+"),
              )
              if not parsed:
                  raise SystemExit(f"{label} badge has no user count: {value!r}")
              scale = {"": 1, "k": 1_000, "m": 1_000_000}[parsed.group(2).lower()]
              return round(float(parsed.group(1)) * scale)

          chrome = read_count(
              fetch(
                  "https://img.shields.io/chrome-web-store/users/"
                  f"{os.environ['CHROME_ID']}?label=chrome"
              ),
              "chrome",
          )
          firefox = read_count(
              fetch(
                  f"https://img.shields.io/amo/users/{os.environ['AMO_SLUG']}?label=firefox"
              ),
              "firefox",
          )
          total = chrome + firefox
          badge = fetch(f"https://img.shields.io/badge/users-{total}-blue")
          if read_count(badge, "users") != total:
              raise SystemExit(f"combined badge does not show {total}: {badge[:200]!r}")

          BADGE.write_text(badge)
          summary = (
              "| Source | Users |\n"
              "| --- | ---: |\n"
              f"| Chrome (weekly) | {chrome} |\n"
              f"| Firefox (avg. daily) | {firefox} |\n"
              f"| **Total** | **{total}** |\n"
          )
          SUMMARY.write_text(summary)
          print(summary)
          EOF
          cat "$STORE_USERS_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Build PR body
        env:
          STORE_USERS_SUMMARY: ${{ runner.temp }}/store-users.md
          STORE_USERS_PR_BODY: ${{ runner.temp }}/store-users-pr.md
        run: |
          set -euo pipefail
          {
            echo "Refreshes the self-hosted combined Chrome + Firefox user badge."
            echo
            echo "Chrome shows weekly users; Firefox shows average daily users."
            echo
            cat "$STORE_USERS_SUMMARY"
          } > "$STORE_USERS_PR_BODY"

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PR_BODY_FILE: ${{ runner.temp }}/store-users-pr.md
        run: |
          bash scripts/sync-automation-pr.sh \
            automation/store-users-sync \
            "docs: refresh store user badge" \
            "docs: refresh store user badge" \
            .github/assets/badge-users.svg
