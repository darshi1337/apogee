name: Store Users Sync

# Keeps the self-hosted Chrome and Firefox user badges current.
# Chrome has no public stats API; Shields.io maintains the listing scrape.
# Firefox uses the public AMO API via Shields.io. Main is protected, so
# SYNC_TOKEN opens a PR and auto-merge lands it after the required checks.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-users-sync
  cancel-in-progress: true

jobs:
  sync-store-users:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHROME_ID: pgemlpomhkdcjjjcpnjlebalnfglomog
      AMO_SLUG: apogeeext
    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Add a fine-grained PAT with Contents and Pull requests write access."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh user badges
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://img.shields.io/chrome-web-store/users/${CHROME_ID}?label=chrome&color=green" -o "$tmp/chrome.svg"
          curl -fsSL "https://img.shields.io/amo/users/${AMO_SLUG}?label=firefox&color=orange" -o "$tmp/firefox.svg"
          python3 - "$tmp/chrome.svg" "$tmp/firefox.svg" <<'EOF'
          import re
          import sys
          from pathlib import Path

          VALUE = re.compile(r"^[0-9][0-9.,]*[kKmM]?\+?$")
          counts = {}
          for path, label in [(sys.argv[1], "chrome"), (sys.argv[2], "firefox")]:
              svg = Path(path).read_text()
              match = re.search(rf"<title>{label}: ([^<]+)</title>", svg)
              if not match or not VALUE.fullmatch(match.group(1)):
                  raise SystemExit(
                      f"{label} badge did not contain a user count: {svg[:200]!r}"
                  )
              counts[label] = match.group(1)

          summary = (
              "| Store | Users |\n"
              "| --- | ---: |\n"
              f"| Chrome (weekly) | {counts['chrome']} |\n"
              f"| Firefox (avg. daily) | {counts['firefox']} |\n"
          )
          Path("/tmp/store-users.md").write_text(summary)
          print(summary)
          EOF
          cat /tmp/store-users.md >> "$GITHUB_STEP_SUMMARY"
          mv "$tmp/chrome.svg" .github/assets/badge-users-chrome.svg
          mv "$tmp/firefox.svg" .github/assets/badge-users-firefox.svg

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if git diff --quiet -- .github/assets/badge-users-chrome.svg .github/assets/badge-users-firefox.svg; then
            echo "Store user badges already current."
            exit 0
          fi
          branch="automation/store-users-sync"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/assets/badge-users-chrome.svg .github/assets/badge-users-firefox.svg
          git commit -m "docs: refresh store user badges"
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            {
              echo "Refreshes the self-hosted Chrome and Firefox user badges."
              echo
              echo "Chrome shows weekly users; Firefox shows average daily users."
              echo
              cat /tmp/store-users.md
            } > /tmp/store-users-pr.md
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs: refresh store user badges" \
              --body-file /tmp/store-users-pr.md
            pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          fi
          if [ -z "$(gh pr view "$pr" --json autoMergeRequest -q '.autoMergeRequest // empty')" ]; then
            gh pr merge "$pr" --auto --squash
          fi
