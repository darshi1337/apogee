name: Apply issue 198 fix

on:
  push:
    branches:
      - fix/issue-198-popup-file-upload

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix popup file upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apogee-extension/ui/app.js')
          s = p.read_text()
          old = '''document\n  .getElementById("uploadFileBtn")\n  ?.addEventListener("click", async () => {\n    if (!isSidePanelSurface) {\n      try {\n        await openSidePanel();\n        closeTransientSurface();\n      } catch (err) {\n        console.error("Could not open side panel for file upload:", err);\n        announce(`Could not open side panel: ${err.message || err}`);\n      }\n      return;\n    }\n    fileUploadInput?.click();\n  });'''
          new = '''document\n  .getElementById("uploadFileBtn")\n  ?.addEventListener("click", () => {\n    fileUploadInput?.click();\n  });'''
          if old not in s:
              raise SystemExit('expected issue #198 block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apogee-extension/ui/app.js .github/workflows/issue-198-fix.yml
          git commit -m "fix: allow file upload from popup"
          git rm .github/workflows/issue-198-fix.yml
          git commit -m "chore: remove issue 198 helper workflow"
          git push
