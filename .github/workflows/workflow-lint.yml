name: Workflow lint

# Lints the workflows themselves. Cheap, read-only. No paths filter on
# pull_request on purpose: actionlint/zizmor are required branch-protection
# checks, and a required check from a paths-skipped workflow waits forever
# ("Expected") and blocks the PR. Push keeps the filter to skip no-op runs.
# Catches bad YAML, wrong contexts, and risky permissions
# (e.g. pull_request_target without need).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          fail_level: error

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Annotations instead of Advanced Security: SARIF upload needs
      # security-events: write, which this read-only workflow must not have.
      # Per the action docs these two are mutually exclusive.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          annotations: true
