name: Workflow lint

# Lints the workflows themselves. Cheap, read-only, runs only when
# workflows change. Catches bad YAML, wrong contexts, and risky
# permissions (e.g. pull_request_target without need).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.73.4
        with:
          fail_level: error

  zizmor:
    # Advisory until the first green run proves the config in this repo,
    # then drop continue-on-error to make it blocking.
    name: zizmor (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Annotations instead of Advanced Security: SARIF upload needs
      # security-events: write, which this read-only workflow must not have.
      # Per the action docs these two are mutually exclusive.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.3
        with:
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          annotations: true
