name: Changelog Sync

# Keeps the [Unreleased] section of CHANGELOG.md current after every merge to
# main. Release-please owns the versioned sections; this workflow only
# rewrites [Unreleased] from conventional commits since the last tag, so after
# a release ships the section shrinks back on its own.
# Main is protected, so GITHUB_TOKEN cannot push. SYNC_TOKEN is a fine-grained
# PAT with Contents and Pull requests write access. The PAT opens a PR so CI
# runs, then auto-merge lands it when the required checks pass.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-unreleased:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Add a fine-grained PAT with Contents and Pull requests write access."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false # the push below uses the PAT remote URL

      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.10.0/git-cliff-2.10.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          echo "/tmp/git-cliff-2.10.0" >> "$GITHUB_PATH"

      - name: Rewrite Unreleased section
        run: |
          git-cliff --config cliff.toml --unreleased > /tmp/unreleased-body.md
          python3 - <<'EOF'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          lines = changelog.read_text().splitlines(keepends=True)

          start = next(
              i for i, l in enumerate(lines) if l.startswith("## [Unreleased]")
          )
          end = next(
              (
                  i
                  for i, l in enumerate(lines[start + 1 :], start + 1)
                  if l.startswith("## [")
              ),
              len(lines),
          )

          body = Path("/tmp/unreleased-body.md").read_text().strip()
          section = "## [Unreleased]\n" + ("\n" + body + "\n" if body else "")
          changelog.write_text(
              "".join(lines[:start]) + section + "\n" + "".join(lines[end:])
          )
          EOF
          git diff --quiet -- CHANGELOG.md && echo "unchanged" || echo "changed"

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already current."
            exit 0
          fi
          branch="automation/changelog-sync"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md
          git commit -m "docs: sync changelog unreleased section"
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs: sync changelog unreleased section" \
              --body "Regenerates the Unreleased changelog section from conventional commits since the last tag."
            pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          fi
          if [ -z "$(gh pr view "$pr" --json autoMergeRequest -q '.autoMergeRequest // empty')" ]; then
            gh pr merge "$pr" --auto --squash
          fi
