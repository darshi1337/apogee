name: Changelog Sync

# Keeps the [Unreleased] section of CHANGELOG.md current after every merge to
# main. Release-please owns the versioned sections; this workflow only
# rewrites [Unreleased] from conventional commits since the last tag, so after
# a release ships the section shrinks back on its own.
# Main is protected, so GITHUB_TOKEN cannot push. SYNC_TOKEN is a fine-grained
# PAT with Contents and Pull requests write access. The PAT opens a PR so CI
# runs, then auto-merge lands it when the required checks pass.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: changelog-sync
  cancel-in-progress: true

jobs:
  sync-unreleased:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GIT_CLIFF_VERSION: 2.10.0
      GIT_CLIFF_SHA512: 9090c844c5d5515237893c3a05cfef8a029c927123e235b51516f0a53f67456dc6ac9611e7280fb8ba176c9b9c924f2c5294a52e56dcc293d62100e8454ccc1a
    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Add a fine-grained PAT with Contents and Pull requests write access."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false # the push below uses the PAT credential helper

      - name: Install git-cliff
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/git-cliff.tar.gz"
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          echo "${GIT_CLIFF_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Rewrite Unreleased section
        env:
          UNRELEASED_BODY: ${{ runner.temp }}/unreleased-body.md
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --unreleased > "$UNRELEASED_BODY"
          python3 - <<'EOF'
          import os
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          lines = changelog.read_text().splitlines(keepends=True)

          start = next(
              i for i, l in enumerate(lines) if l.startswith("## [Unreleased]")
          )
          end = next(
              (
                  i
                  for i, l in enumerate(lines[start + 1 :], start + 1)
                  if l.startswith("## [")
              ),
              len(lines),
          )

          body = Path(os.environ["UNRELEASED_BODY"]).read_text().strip()
          section = "## [Unreleased]\n" + ("\n" + body + "\n" if body else "")
          changelog.write_text(
              "".join(lines[:start]) + section + "\n" + "".join(lines[end:])
          )
          EOF

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PR_BODY: "Regenerates the Unreleased changelog section from conventional commits since the last tag."
        run: |
          bash scripts/sync-automation-pr.sh \
            automation/changelog-sync \
            "docs: sync changelog unreleased section" \
            "docs: sync changelog unreleased section" \
            CHANGELOG.md
