name: Scorecard supply-chain security

# OpenSSF Scorecard rates the repo's supply-chain hygiene and publishes
# a README badge. Runs weekly, on pushes to main, and whenever branch
# protection changes (the cheapest signal that the security posture moved).

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 0"
  push:
    branches: ["main"]
  workflow_dispatch: # manual rescan, e.g. after hardening work

permissions: read-all

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF results
      id-token: write # publish_results needs the OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        # Deliberately tag-pinned, not SHA-pinned: scorecard.dev's publish
        # verification rejects raw SHAs as "imposter commits" and then no
        # results ever reach the public API. This is the one sanctioned
        # exception; everything else stays SHA-pinned.
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained PAT (Administration: read-only) stored as
          # SCORECARD_TOKEN so the Branch-Protection check can read the
          # classic rules; GITHUB_TOKEN cannot and the check errors to -1.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
