name: Security scans

# Complements CodeQL + dependency-review:
# - Gitleaks is BLOCKING (fake test keys are allowlisted in .gitleaks.toml).
# - OSV + npm audit are REPORT-ONLY: addons-linter pulls a known-vulnerable
#   image-size whose fix needs a breaking major bump, so failing the build
#   here would keep main red until that migration lands. Triage the uploaded
#   reports instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history + working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  vulns:
    name: OSV + npm audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apogee-extension
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apogee-extension/package-lock.json

      - run: npm ci

      # Pinned CLI binary, not the marketplace action: v2 of
      # osv-scanner-action ships reusable workflows only (no step action),
      # and this job wants a plain report next to npm audit anyway.
      - name: OSV scan (report-only)
        continue-on-error: true
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=package-lock.json --format=json > /tmp/osv-report.json || true
          /tmp/osv-scanner scan --lockfile=package-lock.json --format=table || true

      - name: npm audit report
        run: |
          npm audit --audit-level=high --json > /tmp/npm-audit.json || true
          HIGH=$(node -e 'const r=require("/tmp/npm-audit.json"); const v=(r.metadata&&r.metadata.vulnerabilities)||{}; console.log((v.high||0)+" high, "+(v.critical||0)+" critical")')
          echo "### npm audit (report-only): $HIGH" >> "$GITHUB_STEP_SUMMARY"
          echo "Known issue: image-size via addons-linter/web-ext needs a breaking major bump; triage before promoting to blocking." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            /tmp/npm-audit.json
            /tmp/osv-report.json
          retention-days: 14
