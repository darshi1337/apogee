name: Security scans

# Complements CodeQL + dependency-review:
# - Gitleaks is BLOCKING (fake test keys are allowlisted in .gitleaks.toml).
# - OSV + npm audit are REPORT-ONLY: the only findings trace to two advisories
#   with no patched version published upstream —
#     * adm-zip symlink traversal (latest 0.6.0 still flagged; pinned via
#       overrides; audit's only "fix" is downgrading transformers, rejected)
#     * image-size parser DoS (latest 2.0.2 still flagged; latest
#       addons-linter 10.11.0 still ships it)
#   Both are dev-only/install-time and never ship in dist/ (enforced by the
#   "vulnerable dev-only packages" guard in package.yml), so failing the build
#   here would keep main red with no actionable upgrade. Triage the uploaded
#   reports instead, and re-test an addons-linter bump whenever upstream
#   publishes fixed image-parser dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history + working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  vulns:
    name: OSV + npm audit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OSV_VERSION: v2.5.1
      OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    defaults:
      run:
        working-directory: apogee-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apogee-extension/package-lock.json

      - run: npm ci

      # Pinned CLI binary, not the marketplace action: v2 of
      # osv-scanner-action ships reusable workflows only (no step action),
      # and this job wants a plain report next to npm audit anyway.
      - name: OSV scan (report-only)
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o "$RUNNER_TEMP/osv-scanner"
          echo "${OSV_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan --lockfile=package-lock.json --format=json > "$RUNNER_TEMP/osv-report.json" || true

      - name: npm audit report
        continue-on-error: true
        env:
          NPM_AUDIT_JSON: ${{ runner.temp }}/npm-audit.json
        run: |
          npm audit --audit-level=high --json > "$NPM_AUDIT_JSON" || true
          HIGH=$(node -e 'const r=require(process.env.NPM_AUDIT_JSON); const v=(r.metadata&&r.metadata.vulnerabilities)||{}; console.log((v.high||0)+" high, "+(v.critical||0)+" critical")')
          echo "### npm audit (report-only): $HIGH" >> "$GITHUB_STEP_SUMMARY"
          echo "Known issues, both unpatched upstream and dev-only (never in dist/): adm-zip via onnxruntime-node/firefox-profile, image-size via addons-linter/web-ext. Triage before promoting to blocking." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audit-reports
          path: |
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/osv-report.json
          if-no-files-found: warn
          retention-days: 14
