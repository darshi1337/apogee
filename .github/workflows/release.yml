name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload zips
      id-token: write # keyless Sigstore signing via GitHub OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No dependency cache here on purpose: setup-node caches by default
      # via packageManager detection, and a poisoned cache in the release
      # job would ship straight to users (zizmor cache-poisoning).
      # Releases are rare; the extra minute of npm ci is worth it.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        run: npm run package

      # Keyless signing with Cosign: Fulcio issues a short-lived cert bound
      # to this workflow's OIDC identity, Rekor logs the entry. Produces a
      # Sigstore bundle per artifact so anyone can verify offline with
      # `cosign verify-blob --bundle`.
      # NOTE: the JS route is dead — the `sigstore` npm package (v2+) ships
      # no executable, and its successor `@sigstore/cli` dropped the `sign`
      # commands entirely (attest/verify only). Cosign is the maintained
      # path for signing release blobs in CI. (Cosign v3 removed the old
      # --output-signature/--output-certificate flags; --bundle is the
      # replacement and emits the new bundle format.)
      # And `npm run package` writes the zips to the repo root
      # (web-ext --artifacts-dir ../), not to apogee-extension/, so locate
      # them explicitly.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts with Cosign
        run: |
          mapfile -t ARTIFACTS < <(find .. -maxdepth 1 \( -name 'apogee-*-chrome.zip' -o -name 'apogee-*-mozilla.xpi' \))
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then echo "no packaged artifacts found"; exit 1; fi
          for f in "${ARTIFACTS[@]}"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # gh CLI instead of softprops/action-gh-release: one less third-party
      # action in the release path (zizmor superfluous-actions), same result.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag name via env, never expanded into the script: ref names are
          # attacker-controllable and would be code injection (zizmor
          # template-injection) if interpolated with ${{ }}.
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          ARTIFACTS=( ../apogee-*-chrome.zip ../apogee-*-mozilla.xpi ../apogee-*.sigstore.json )
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then echo "no artifacts to release"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ARTIFACTS[@]}" --clobber
          else
            gh release create "$TAG" --generate-notes --title "$TAG" "${ARTIFACTS[@]}"
          fi

      - name: Regenerate release notes with contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName --jq '.[].tagName' | grep -vxF "$TAG" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" --jq .body)
          else
            NOTES=$(gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          fi
          printf '%s\n' "$NOTES" | gh release edit "$TAG" --notes-file -

      - name: Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        run: |
          ZIP_FILE=$(find .. -maxdepth 1 -name 'apogee-*-chrome.zip' 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Chrome zip not found: ../apogee-*-chrome.zip"
            ls -la ../*.zip 2>/dev/null || ls -la . 2>/dev/null
            exit 1
          fi
          echo "Uploading $ZIP_FILE to Chrome Web Store"
          npx chrome-webstore-upload-cli@4 --source "$ZIP_FILE" --extension-id "$EXTENSION_ID" --publisher-id "$PUBLISHER_ID"
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}

      - name: Publish to Mozilla Add-ons (AMO)
        if: env.AMO_API_KEY != ''
        run: |
          npx web-ext sign \
            --source-dir dist/firefox \
            --api-key ${{ secrets.AMO_API_KEY }} \
            --api-secret ${{ secrets.AMO_API_SECRET }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
