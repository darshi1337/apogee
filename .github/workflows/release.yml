name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apogee-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apogee-*-chrome.zip
            apogee-*-mozilla.xpi
          generate_release_notes: true
