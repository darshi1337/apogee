name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache here on purpose: setup-node caches by default
      # via packageManager detection, and a poisoned cache in the release
      # job would ship straight to users (zizmor cache-poisoning).
      # Releases are rare; the extra minute of npm ci is worth it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apogee-*-chrome.zip
            apogee-*-mozilla.xpi
          generate_release_notes: true

      - name: Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        run: |
          ZIP_FILE=$(ls ../apogee-*-chrome.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Chrome zip not found: ../apogee-*-chrome.zip"
            ls -la ../*.zip 2>/dev/null || ls -la . 2>/dev/null
            exit 1
          fi
          echo "Uploading $ZIP_FILE to Chrome Web Store"
          npx chrome-webstore-upload-cli@4 --source "$ZIP_FILE" --extension-id "$EXTENSION_ID" --publisher-id "$PUBLISHER_ID"
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}

      - name: Publish to Mozilla Add-ons (AMO)
        if: env.AMO_API_KEY != ''
        run: |
          npx web-ext sign \
            --source-dir dist/firefox \
            --api-key ${{ secrets.AMO_API_KEY }} \
            --api-secret ${{ secrets.AMO_API_SECRET }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
