name: Star gate

# pull_request_target (not pull_request): this job never checks out PR code.
# It only reads the author's public starred list and comments on the PR, so the
# base workflow runs on fork PRs without exposing secrets to untrusted code.
on:
  # zizmor: ignore[dangerous-triggers] -- safe use: no checkout, no PR code
  # execution, and no secrets. The token is scoped to this job and only
  # writes PR comments.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: star-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  starred:
    name: Author starred the repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the stargazer list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          COMMENT_MARKER: "<!-- star-gate -->"
        run: |
          set -euo pipefail

          case "$AUTHOR_TYPE" in
            User) ;;
            Bot|Organization|Mannequin)
              echo "::notice::$AUTHOR is a $AUTHOR_TYPE account, so the star requirement does not apply."
              exit 0
              ;;
            *)
              echo "::error title=Star check failed::Unknown author type: $AUTHOR_TYPE."
              exit 1
              ;;
          esac

          find_nag() {
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$COMMENT_MARKER\"))) | .id"
          }

          remove_nag() {
            local id
            for id in $(find_nag 2>/dev/null || true); do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null 2>&1 || true
            done
          }

          post_nag() {
            if find_nag 2>/dev/null | grep -q .; then
              return 0
            fi

            cat > "$RUNNER_TEMP/star-gate-nag.md" <<EOF
          $COMMENT_MARKER
          Thanks for the pull request, @$AUTHOR.

          Could you please star the repo? We ask for a star before we merge a PR, and it takes one click:

          https://github.com/$REPO

          After you star it, push a commit or close and reopen this PR. The \`Author starred the repo\` check runs again and deletes this comment.
          EOF

            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/star-gate-nag.md"
          }

          page=1
          while :; do
            if ! gh api "users/$AUTHOR/starred?per_page=100&page=$page" --jq '.[].full_name' > "$RUNNER_TEMP/starred-repos.txt"; then
              echo "::error title=Star check failed::Could not read the starred repositories for $AUTHOR."
              exit 1
            fi

            if grep -Fixq "$REPO" "$RUNNER_TEMP/starred-repos.txt"; then
              echo "::notice::$AUTHOR starred $REPO."
              remove_nag
              exit 0
            fi

            if [ "$(wc -l < "$RUNNER_TEMP/starred-repos.txt")" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
          done

          if post_nag; then
            echo "::error title=Star required::$AUTHOR has not starred $REPO yet. A comment with the one-click link was posted."
          else
            echo "::error title=Star required::$AUTHOR has not starred $REPO yet. Star the repo, then push a commit or reopen this PR to re-run the check."
          fi
          exit 1
