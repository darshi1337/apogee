name: Docs

# Link checking + spell checking for the markdown-heavy repo.
# Lychee is tolerant (403/429 accepted, localhost excluded) via lychee.toml.
# CSpell uses cspell.json + .cspell-project-words.txt — add project terms
# there instead of scattering inline ignores.

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "site/**"
      - "lychee.toml"
      - "cspell.json"
      - ".cspell-project-words.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - "site/**"
      - "lychee.toml"
      - "cspell.json"
      - ".cspell-project-words.txt"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    name: Lychee link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check markdown + site links
        # Scoped to project prose on purpose: '**/*.md' would also crawl
        # node_modules READMEs (7000+ dependency links). CHANGELOG.md is
        # excluded in lychee.toml (bot-generated commit links).
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml --verbose --no-progress '*.md' 'docs/**/*.md' 'apogee-extension/tests/extractors/README.md' 'site/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spelling:
    name: CSpell (markdown only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check spelling in prose
        # Scoped to markdown on purpose: checking code/CSS/HTML flags every
        # identifier (fcard, fcol, ...) as a typo. CHANGELOG.md is generated
        # from commit subjects and is excluded in cspell.json for the same
        # reason. New project terms go in .cspell-project-words.txt.
        run: npx --yes cspell@10.4.0 lint --no-progress --no-summary --config ./cspell.json "**/*.md"
