name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo - it never writes to it, so the token stays read-only
# instead of inheriting whatever the repository default happens to be.
permissions:
  contents: read

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apogee-extension/package-lock.json

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm run lint:webext
