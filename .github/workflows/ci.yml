name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo - it never writes to it, so the token stays read-only
# instead of inheriting whatever the repository default happens to be.
permissions:
  contents: read

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apogee-extension/package-lock.json

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm test

      - run: npm run build
