name: Contributors Sync

# Keeps the README contributors wall current. Regenerates the avatar table
# between the contributors markers from the GitHub contributors API
# (humans only, most commits first) and opens a PR when it changed.
# Runs on every push to main, weekly, and on demand.
# Main is protected, so GITHUB_TOKEN cannot push. SYNC_TOKEN is a fine-grained
# PAT with Contents and Pull requests write access. The PAT opens a PR so CI
# runs, then auto-merge lands it when the required checks pass.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributors-sync
  cancel-in-progress: true

jobs:
  sync-contributors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Add a fine-grained PAT with Contents and Pull requests write access."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate contributors table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/contributors" --paginate \
            -q '.[] | select(.type == "User") | .login' > "$RUNNER_TEMP/contributors.txt"
          python3 - <<'EOF'
          import os
          from pathlib import Path

          users = Path(os.environ["RUNNER_TEMP"], "contributors.txt").read_text().split()
          tiles = " ".join(
              f'<a href="https://github.com/{u}">'
              f'<img src="https://github.com/{u}.png?size=100" width="50" '
              f'alt="{u}" /></a>'
              for u in users
          )
          block = (
              "<!-- contributors:start -->\n"
              "<!-- cspell:disable --><!-- contributor usernames are not dictionary words -->\n"
              "<p>\n  " + tiles + "\n</p>\n"
              "<!-- cspell:enable -->\n"
              "<!-- contributors:end -->"
          )

          readme = Path("README.md")
          text = readme.read_text()
          start = text.index("<!-- contributors:start -->")
          end = (
              text.index("<!-- contributors:end -->")
              + len("<!-- contributors:end -->")
          )
          readme.write_text(text[:start] + block + text[end:])
          print(f"{len(users)} contributors in the wall")
          EOF

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PR_BODY: "Regenerates the contributors wall from the GitHub contributors API."
        run: |
          bash scripts/sync-automation-pr.sh \
            automation/contributors-sync \
            "docs: sync readme contributors wall" \
            "docs: sync readme contributors wall" \
            README.md
