# Path-to-label map for the Labeler workflow (actions/labeler v7 object
# syntax). Keep in sync with the labels that exist in the repo: bug,
# documentation, enhancement, extractor, test, javascript, github_actions,
# dependencies.
documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "site/**"]

extractor:
  - changed-files:
      - any-glob-to-any-file:
          - "apogee-extension/content/extractors/**"
          - "apogee-extension/tests/extractors/**"

test:
  - changed-files:
      - any-glob-to-any-file: ["apogee-extension/tests/**"]

javascript:
  - changed-files:
      - any-glob-to-any-file: ["**/*.js"]

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - "scripts/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "apogee-extension/package.json"
          - "apogee-extension/package-lock.json"
