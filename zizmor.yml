# Zizmor policy for Apogee.
#
# Everything is SHA-pinned except the OpenSSF Scorecard action, whose
# publish-results verification rejects raw SHAs as "imposter commits".
# Allow that single tag-pinned action and enforce hash pins everywhere else.
rules:
  unpinned-uses:
    config:
      policies:
        "ossf/scorecard-action": ref-pin
        "*": hash-pin
